# Kairos — Oracle Cloud 셀프호스팅 스택 (ADR-028)
#
# 이 서버는 다른 개인 프로젝트(quantbridge, truewords)와 공유한다.
# 컨테이너가 격리해주지 않는 것 = 호스트 publish 포트 / 컨테이너 이름 / compose 프로젝트명 / 자원 총량.
# 아래 값들은 2026-08-14 서버 실측(점유: 3200 5432 5433 6333 6380 8100)에 맞춰 정한 것이다.
#
# 실행:  cd ~/kairos && docker compose -f docker-compose.prod.yml up -d
#        (top-level `name:` 이 프로젝트명을 고정하므로 -p 플래그는 불필요)

name: kairos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL + pgvector ────────────────────────────────────────────────
  # 0.8.0-pg17 = Neon 원본과 정확히 동일 (PG 17.10 / vector 0.8.0).
  # embeddings/repository.py 의 hnsw.iterative_scan 은 pgvector >= 0.8 을 요구한다.
  db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: kairos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ── alembic one-shot ─────────────────────────────────────────────────────
  # 앱 기동과 분리한다. 묶으면 restart 정책과 결합해 마이그레이션 실패가 무한 루프가 되고
  # "마이그레이션 실패"와 "앱 크래시"를 구분할 수 없다 (2026-06-30 prod crash-loop).
  migrate:
    image: kairos-api:${KAIROS_API_TAG}
    container_name: kairos-migrate
    command: ["migrate"]
    restart: "no"
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging

  # ── FastAPI ──────────────────────────────────────────────────────────────
  api:
    image: kairos-api:${KAIROS_API_TAG}
    container_name: kairos-api
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:8200:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 1536m
    # ffmpeg chunk 병렬이 2 OCPU 를 전부 먹어 같은 호스트의 quantbridge 소크를 굶기는 것을 막는다.
    cpus: 1.5
    # BackgroundTasks 는 재시도가 없다 — 배포 중 진행 중이던 회의 처리가 죽으면 영구 정지한다.
    # graceful shutdown 에 최대 15분을 준다.
    stop_grace_period: 900s
    healthcheck:
      # 이미지에 curl 이 없다(python:3.12-slim). /health 는 liveness 전용 — DB 를 보지 않는다.
      # /ready 를 쓰면 Neon/DB 일시 장애에 컨테이너가 unhealthy 로 마킹돼 불필요한 연쇄가 생긴다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # ── Next.js (standalone) ─────────────────────────────────────────────────
  # NEXT_PUBLIC_* 는 이미지 빌드타임에 인라인된다 — 여기서 바꿔도 반영되지 않는다.
  # 런타임에 필요한 것은 CLERK_SECRET_KEY 뿐 (Next 16 + Clerk 7.4.1 은 서버 사이드에서 요구).
  web:
    image: kairos-web:${KAIROS_WEB_TAG}
    container_name: kairos-web
    restart: unless-stopped
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ── Cloudflare Tunnel ────────────────────────────────────────────────────
  # network_mode: host 인 이유 — 이 호스트의 iptables 는 INPUT 에서 22 만 ACCEPT 하고
  # 나머지를 REJECT 한다. 브리지 네트워크에서 호스트 127.0.0.1 로 가는 경로가 구조적으로 없다.
  # host 로 띄우면 남의 프로젝트(quantbridge/truewords 의 cloudflared)도 iptables 도 건드리지 않는다.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.0
    container_name: kairos-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${KAIROS_TUNNEL_TOKEN}
    depends_on:
      - api
      - web
    mem_limit: 128m
    logging: *default-logging

volumes:
  db-data:
