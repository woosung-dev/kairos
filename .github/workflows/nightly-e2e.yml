name: Nightly Heavy E2E

# BL-043: meeting-upload e2e 분리 — Whisper API + R2 prod bucket + ffmpeg
# full chain 의존. 매 PR e2e default skip (E2E_RUN_HEAVY ≠ true) → 본 워크플로우가
# 매일 새벽 main 에서 실행해 전체 파이프라인 회귀 가드.

on:
  schedule:
    # 매일 KST 03:00 (UTC 18:00 전날) — 한국 사용자 영향 최소 시각
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  heavy-e2e:
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_ENABLED == 'true' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      LOCAL_API_URL: http://localhost:8000
      LOCAL_DATABASE_URL: postgresql+asyncpg://kairos:kairos@localhost:5432/kairos_e2e

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # ── ffmpeg 설치 (m4a/webm/mp4 → wav 변환용 — memory voice 경로) ─
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=kairos psql -h localhost -U kairos -d kairos_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=kairos psql -h localhost -U kairos -d kairos_e2e -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      # ── 백엔드 ─────────────────────────────────────────────────────────
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      - name: Install backend deps
        working-directory: backend
        # Sprint 28 BUG-S28-SEC-1 — `--frozen` 강제 (lock drift 차단)
        run: uv sync --frozen

      - name: Run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          APP_ENV: test
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: uv run alembic upgrade head

      - name: Start backend (uvicorn background)
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          APP_ENV: test
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CORS_ORIGINS: http://localhost:3003
          FRONTEND_URL: http://localhost:3003
        run: |
          uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend ready (attempt $i)"
              exit 0
            fi
            echo "⏳ attempt $i: status=$STATUS"
            sleep 2
          done
          echo "❌ Backend failed to start"
          cat /tmp/backend.log
          exit 1

      # ── 프론트엔드 ─────────────────────────────────────────────────────
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ env.LOCAL_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
        run: pnpm build

      - name: Start Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ env.LOCAL_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
        run: pnpm start -p 3003 &

      - name: Wait for Next.js app
        run: npx wait-on http://localhost:3003/ -t 60000

      # ── Heavy specs 만 실행 (meeting-upload + rag-citation) ──────────
      - name: Run heavy Playwright specs
        working-directory: frontend
        env:
          CI: "true"
          E2E_PORT: "3003"
          E2E_RUN_HEAVY: "true"
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_API_URL: ${{ env.LOCAL_API_URL }}
        run: pnpm e2e tests/meeting-upload.spec.ts tests/rag-citation.spec.ts

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nightly-heavy-trace
          path: frontend/playwright-report/
          retention-days: 30
