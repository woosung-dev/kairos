name: Test

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, qa-fix]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      # Sprint 28 BUG-S28-SEC-1 — `--frozen` 강제 (lock-pyproject drift PR CI 통과 차단)
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --ignore=tests/services/test_transcription.py --ignore=tests/test_r2_cors_regression.py -v
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          CLERK_SECRET_KEY: "sk_test_fake"
          CLERK_WEBHOOK_SECRET: "whsec_fake"
          R2_ACCOUNT_ID: "fake"
          R2_ACCESS_KEY_ID: "fake"
          R2_SECRET_ACCESS_KEY: "fake"
          R2_BUCKET_NAME: "fake"
          GEMINI_API_KEY: "fake"
          OPENAI_API_KEY: "fake"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (includes type check)
        run: pnpm build
        env:
          # Clerk 7.4.1 publishable key 검증 통과 형식 — pk_test_ + base64(host$).
          # `clerk.example.com$` → Y2xlcmsuZXhhbXBsZS5jb20k. 실제 fake 라 API 호출 X.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

      # Sprint 27e Round 2 BUG-S27e-TEST-r2-1 — FE 보안 헤더 회귀 가드 CI 게이트.
      # security-headers.spec.ts 는 public route (`/sign-in`, `/`) 만 검증 — secrets/BE 불요.
      # frontend-build job 의 build artifact 재사용 → 항상 실행 (E2E_ENABLED 무관).
      - name: Install Playwright (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Next.js app for security-headers spec
        env:
          # Clerk 7.4.1 publishable key 검증 통과 형식 — pk_test_ + base64(host$).
          # `clerk.example.com$` → Y2xlcmsuZXhhbXBsZS5jb20k. 실제 fake 라 API 호출 X.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
          # Sprint 27e Round 2 r2-1 — Next.js 16 + Clerk 7.4.1 runtime 가 server-side
          # secretKey 필요 (build 시점만 아니라 next start 도). fake 값으로 부팅 OK
          # (validation 없음, secrets 없이 public route 만 검증하므로 영향 0).
          CLERK_SECRET_KEY: "sk_test_fake"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        # 0.0.0.0 bind 명시 — CI 환경에서 IPv4/IPv6 dual-stack 보장.
        run: |
          pnpm start -p 3000 -H 0.0.0.0 > /tmp/next.log 2>&1 &
          echo "Next.js PID $!"

      - name: Wait for Next.js (security-headers gate)
        # Sprint 27e Round 2 r2-1: wait-on 은 OS DNS (Node.js) 사용 — localhost OK.
        # chromium 만 별도 fix (playwright.config.ts --host-resolver-rules 매핑).
        run: |
          npx wait-on http://127.0.0.1:3000/sign-in -t 180000 -v || {
            echo "--- wait-on failed; /tmp/next.log ---"
            cat /tmp/next.log || true
            exit 1
          }

      - name: Run security-headers spec only (public route, no secrets)
        env:
          E2E_PORT: "3000"
          # baseURL localhost — chromium 의 --host-resolver-rules 가 127.0.0.1 매핑.
          E2E_BASE_URL: "http://localhost:3000"
        run: pnpm exec playwright test --project=public-only

      - name: Upload Next.js log on failure
        if: failure()
        run: cat /tmp/next.log || true

  # ── E2E 잡 활성화 방법 ────────────────────────────────────────────────────────
  # 1. Repository Settings → Secrets and variables → Variables 탭
  #    E2E_ENABLED = 'true' 추가
  # 2. Secrets 탭에서 아래 시크릿 등록:
  #    E2E_CLERK_PUBLISHABLE_KEY, E2E_CLERK_SECRET_KEY
  #    E2E_API_URL, E2E_USER_EMAIL, E2E_USER_PASSWORD
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    # Clerk testing credentials 설정된 환경에서만 실행 (secrets 등록 이후 활성화).
    if: ${{ vars.E2E_ENABLED == 'true' }}
    needs: frontend-build

    # Postgres + pgvector + halfvec (pg16) service container — local BE 백킹.
    # prod Cloud Run BE 의존 제거 (cold start 503 회귀 차단).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # local BE URL — Playwright + Next.js build 모두 사용
      LOCAL_API_URL: http://localhost:8000
      LOCAL_DATABASE_URL: postgresql+asyncpg://kairos:kairos@localhost:5432/kairos_e2e

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # ── pgvector 확장 활성화 (CREATE EXTENSION vector + pg_trgm) ─────
      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=kairos psql -h localhost -U kairos -d kairos_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=kairos psql -h localhost -U kairos -d kairos_e2e -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      # ── 백엔드 (uvicorn) 부팅 ─────────────────────────────────────────
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      - name: Install backend deps
        working-directory: apps/backend
        # Sprint 28 BUG-S28-SEC-1 — `--frozen` 강제 (lock drift 차단)
        run: uv sync --frozen

      - name: Run alembic upgrade head
        working-directory: apps/backend
        # alembic env.py 가 src.core.config.get_settings 호출 → pydantic Settings 의
        # 모든 SecretStr 필드 (Clerk/AI/R2) 필요. DATABASE_URL 만으론 ValidationError.
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          APP_ENV: test
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: uv run alembic upgrade head

      - name: Start backend (uvicorn background)
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          APP_ENV: test
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CORS_ORIGINS: http://localhost:3003
          FRONTEND_URL: http://localhost:3003
        run: |
          uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "Backend PID $!"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend ready (attempt $i)"
              exit 0
            fi
            echo "⏳ attempt $i: status=$STATUS, retry in 2s"
            sleep 2
          done
          echo "❌ Backend failed to start"
          echo "--- backend log ---"
          cat /tmp/backend.log
          exit 1

      # ── 프론트엔드 (Next.js) 빌드 + 부팅 ───────────────────────────────
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ env.LOCAL_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
        run: pnpm build

      - name: Start Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ env.LOCAL_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
        run: pnpm start -p 3003 &

      - name: Wait for Next.js app
        run: npx wait-on http://localhost:3003/ -t 60000

      # ── Playwright 실행 (local BE 사용) ────────────────────────────────
      - name: Run Playwright tests
        working-directory: apps/web
        env:
          CI: "true"
          E2E_PORT: "3003"
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_API_URL: ${{ env.LOCAL_API_URL }}
        run: pnpm e2e

      # ── 디버그 / 산출물 ────────────────────────────────────────────────
      - name: Backend log on failure
        if: failure()
        run: |
          echo "--- /tmp/backend.log ---"
          cat /tmp/backend.log || true

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-trace
          path: apps/web/playwright-report/
          retention-days: 7
