name: Test

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, qa-fix]

# ADR-027 D4 — PR 은 superseded run 취소, push(main/prod)는 절대 취소 금지 (배포 인접 증거 보존).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 변경 감지 (ADR-027 D4) ─────────────────────────────────────────────
  # PR 이벤트에서만 paths-filter 실행 (PR files API 사용 — checkout 불필요).
  # push(main/prod)는 전체 강제 실행 — dorny push-base 엣지케이스 자체를 회피.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.web }}
      contracts: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.contracts }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/test.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/test.yml'
            contracts:
              - 'apps/api/**'
              - 'apps/web/src/types/api.gen.ts'
              - 'apps/web/package.json'
              - 'apps/web/pnpm-lock.yaml'
              - 'contracts/**'
              - 'justfile'
              - '.github/workflows/test.yml'

  backend-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      # Sprint 28 BUG-S28-SEC-1 — `--frozen` 강제 (lock-pyproject drift PR CI 통과 차단)
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --ignore=tests/services/test_transcription.py --ignore=tests/test_r2_cors_regression.py -v
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          R2_ACCOUNT_ID: "fake"
          R2_ACCESS_KEY_ID: "fake"
          R2_SECRET_ACCESS_KEY: "fake"
          R2_BUCKET_NAME: "fake"
          GEMINI_API_KEY: "fake"
          OPENAI_API_KEY: "fake"

  frontend-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (includes type check)
        run: pnpm build
        env:
          # ADR-031: Better Auth 는 빌드타임 공개키가 없다 (위 frontend-build 주석 참조).
          BETTER_AUTH_SECRET: "ci-fake-secret-at-least-32-bytes-long"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

      # Sprint 27e Round 2 BUG-S27e-TEST-r2-1 — FE 보안 헤더 회귀 가드 CI 게이트.
      # security-headers.spec.ts 는 public route (`/sign-in`, `/`) 만 검증 — secrets/BE 불요.
      # frontend-build job 의 build artifact 재사용 → 항상 실행 (E2E_ENABLED 무관).
      - name: Install Playwright (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # ★서버 기동 + wait-on + spec 실행은 `just fe-security-headers` 가 소유한다.
      # 여기에 사본을 두면 로컬과 CI 가 갈라진다 — 2026-08-16 코드리뷰가 정확히 그 상태를 잡았다
      # (포트/바인드/타임아웃/로그경로 4곳이 이미 달랐다). justfile 상단 "문자 동일" 규약 참조.
      - name: Security headers gate (build artifact, public route)
        working-directory: ${{ github.workspace }}
        env:
          # ADR-031: Better Auth 는 빌드타임 공개키가 없다. `next build` 의 page data 수집이
          # auth.ts 를 평가하므로 기본 secret 경고만 없애는 더미를 준다 (DB 접속은 없다).
          # ★`just fe-security-headers` 의 기본값과 문자 그대로 같은 값이어야 한다
          #   (justfile 상단 "문자 동일" 규약). 한쪽만 바꾸면 로컬과 CI 가 갈라진다.
          BETTER_AUTH_SECRET: "ci-fake-secret-at-least-32-bytes-long"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: just fe-security-headers 3000

      - name: Upload Next.js log on failure
        if: failure()
        run: cat /tmp/kairos-next-headers.log || true

  # ── API 계약 drift 게이트 (ADR-027 D2) ─────────────────────────────────
  # export_openapi.py 가 src.main import → backend-test 와 동일한 fake env 필요.
  # `just contracts-check` = 로컬과 문자 그대로 같은 게이트 (justfile 참조).
  contract-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    env:
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      R2_ACCOUNT_ID: "fake"
      R2_ACCESS_KEY_ID: "fake"
      R2_SECRET_ACCESS_KEY: "fake"
      R2_BUCKET_NAME: "fake"
      GEMINI_API_KEY: "fake"
      OPENAI_API_KEY: "fake"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      - name: Install backend deps
        working-directory: apps/api
        run: uv sync --frozen

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Contract drift gate (regenerate + diff)
        run: just contracts-check

  # ── E2E 잡 활성화 방법 ────────────────────────────────────────────────────────
  # 1. Repository Settings → Secrets and variables → Variables 탭
  #    E2E_ENABLED = 'true' 추가
  # 2. Secrets 탭에서 아래 시크릿 등록:
  #    (인증 관련 secret 은 ADR-031 로 불필요 — E2E 계정 email/password 만 쓴다)
  #    E2E_API_URL, E2E_USER_EMAIL, E2E_USER_PASSWORD
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    # !failure()/!cancelled() — frontend-build 가 skipped 여도 실행 가능하되 failed 면 차단.
    # E2E 계정 credentials 설정된 환경에서만 실행 (secrets 등록 이후 활성화).
    needs: [changes, frontend-build]
    if: >-
      ${{ !failure() && !cancelled() && vars.E2E_ENABLED == 'true' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}

    # Postgres + pgvector + halfvec (pg16) service container — local BE 백킹.
    # prod Cloud Run BE 의존 제거 (cold start 503 회귀 차단).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # local BE URL — Playwright + Next.js build 모두 사용
      LOCAL_API_URL: http://localhost:8000
      LOCAL_DATABASE_URL: postgresql+asyncpg://kairos:kairos@localhost:5432/kairos_e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ── pgvector 확장 활성화 (CREATE EXTENSION vector + pg_trgm) ─────
      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=kairos psql -h localhost -U kairos -d kairos_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=kairos psql -h localhost -U kairos -d kairos_e2e -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      # ── 백엔드 (uvicorn) 부팅 ─────────────────────────────────────────
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      - name: Install backend deps
        working-directory: apps/api
        # Sprint 28 BUG-S28-SEC-1 — `--frozen` 강제 (lock drift 차단)
        run: uv sync --frozen

      - name: Run alembic upgrade head
        working-directory: apps/api
        # alembic env.py 가 src.core.config.get_settings 호출 → pydantic Settings 의
        # 모든 SecretStr 필드 (AI/R2) 필요. DATABASE_URL 만으론 ValidationError.
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          APP_ENV: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: uv run alembic upgrade head

      - name: Start backend (uvicorn background)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          APP_ENV: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CORS_ORIGINS: http://localhost:3003
          FRONTEND_URL: http://localhost:3003
        run: |
          uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "Backend PID $!"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend ready (attempt $i)"
              exit 0
            fi
            echo "⏳ attempt $i: status=$STATUS, retry in 2s"
            sleep 2
          done
          echo "❌ Backend failed to start"
          echo "--- backend log ---"
          cat /tmp/backend.log
          exit 1

      # ── 프론트엔드 (Next.js) 빌드 + 부팅 ───────────────────────────────
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.LOCAL_API_URL }}
        run: pnpm build

      - name: Start Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.LOCAL_API_URL }}
        run: pnpm start -p 3003 &

      - name: Wait for Next.js app
        run: npx wait-on http://localhost:3003/ -t 60000

      # ── Playwright 실행 (local BE 사용) ────────────────────────────────
      - name: Run Playwright tests
        working-directory: apps/web
        env:
          CI: "true"
          E2E_PORT: "3003"
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_API_URL: ${{ env.LOCAL_API_URL }}
        run: pnpm e2e

      # ── 디버그 / 산출물 ────────────────────────────────────────────────
      - name: Backend log on failure
        if: failure()
        run: |
          echo "--- /tmp/backend.log ---"
          cat /tmp/backend.log || true

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-trace
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Aggregate gate (ADR-027 D4) ─────────────────────────────────────────
  # branch protection 도입 시 이 job 하나만 required check 로 등록한다.
  # skipped 는 허용 (docs-only PR green), failure/cancelled 는 차단.
  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, backend-test, frontend-build, contract-check, e2e]
    steps:
      - name: Aggregate gate — fail on failure/cancelled, tolerate skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "❌ required job failed or was cancelled"
            exit 1
          fi
          echo "✅ all needed jobs succeeded or were skipped"
