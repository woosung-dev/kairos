name: Test

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --ignore=tests/services/test_transcription.py --ignore=tests/test_r2_cors_regression.py -v
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          CLERK_SECRET_KEY: "sk_test_fake"
          CLERK_WEBHOOK_SECRET: "whsec_fake"
          R2_ACCOUNT_ID: "fake"
          R2_ACCESS_KEY_ID: "fake"
          R2_SECRET_ACCESS_KEY: "fake"
          R2_BUCKET_NAME: "fake"
          GEMINI_API_KEY: "fake"
          OPENAI_API_KEY: "fake"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (includes type check)
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_fake"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ── E2E 잡 활성화 방법 ────────────────────────────────────────────────────────
  # 1. Repository Settings → Secrets and variables → Variables 탭
  #    E2E_ENABLED = 'true' 추가
  # 2. Secrets 탭에서 아래 시크릿 등록:
  #    E2E_CLERK_PUBLISHABLE_KEY, E2E_CLERK_SECRET_KEY
  #    E2E_API_URL, E2E_USER_EMAIL, E2E_USER_OTP
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    # Clerk testing credentials 설정된 환경에서만 실행 (secrets 등록 이후 활성화).
    # 미설정 상태에서는 조기 exit 하여 CI 붉은줄 방지.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js app
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}

      - name: Start Next.js app
        run: pnpm start -p 3003 &
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}

      - name: Wait for app
        run: npx wait-on http://localhost:3003/ -t 60000

      - name: Run Playwright tests
        run: pnpm e2e
        env:
          CI: "true"
          E2E_PORT: "3003"
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_OTP: ${{ secrets.E2E_USER_OTP }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: frontend/playwright-report/
          retention-days: 7
