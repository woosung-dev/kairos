name: Test

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --ignore=tests/services/test_transcription.py --ignore=tests/test_r2_cors_regression.py -v
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          CLERK_SECRET_KEY: "sk_test_fake"
          CLERK_WEBHOOK_SECRET: "whsec_fake"
          R2_ACCOUNT_ID: "fake"
          R2_ACCESS_KEY_ID: "fake"
          R2_SECRET_ACCESS_KEY: "fake"
          R2_BUCKET_NAME: "fake"
          GEMINI_API_KEY: "fake"
          OPENAI_API_KEY: "fake"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (includes type check)
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_fake"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ── E2E 잡 활성화 방법 ────────────────────────────────────────────────────────
  # 1. Repository Settings → Secrets and variables → Variables 탭
  #    E2E_ENABLED = 'true' 추가
  # 2. Secrets 탭에서 아래 시크릿 등록:
  #    E2E_CLERK_PUBLISHABLE_KEY, E2E_CLERK_SECRET_KEY
  #    E2E_API_URL, E2E_USER_EMAIL, E2E_USER_PASSWORD
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    # Clerk testing credentials 설정된 환경에서만 실행 (secrets 등록 이후 활성화).
    # 미설정 상태에서는 조기 exit 하여 CI 붉은줄 방지.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js app
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}

      - name: Start Next.js app
        run: pnpm start -p 3003 &
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}

      - name: Wait for app
        run: npx wait-on http://localhost:3003/ -t 60000

      # Cloud Run BE 가 scale-to-zero 후 cold start 시 503 일관 — 최대 3분 warm-up.
      # deploy.yml 의 --cpu-boost 와 보강 가드. 503 으로 매 PR 머지 차단되는
      # 회귀 방지. BE 안 깨어나면 명시 실패 + 재실행 안내.
      - name: Warm up Cloud Run backend (503 cold start guard)
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$E2E_API_URL/api/v1/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ BE warm (attempt $i, status=$STATUS)"
              exit 0
            fi
            echo "⏳ attempt $i: status=$STATUS, retry in 10s"
            sleep 10
          done
          echo "❌ BE failed to warm after 3 minutes — Cloud Run cold start hang."
          echo "워크어라운드: 본 job 을 ~5분 후 재실행 (BE 다음 deploy 시 warm)."
          exit 1

      - name: Run Playwright tests
        run: pnpm e2e
        env:
          CI: "true"
          E2E_PORT: "3003"
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-trace
          path: frontend/playwright-report/
          retention-days: 7
