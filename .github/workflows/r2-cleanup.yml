# R2 nightly cleanup — uploads/ prefix 누적 객체 정리 (BL-043)
# 수동 트리거 전용 (workflow_dispatch). 사용자 검증 후 cron 추가.
name: R2 Cleanup

on:
  workflow_dispatch:
    inputs:
      days:
        description: "이 N 일보다 오래된 객체 정리"
        required: false
        default: "30"
      delete:
        description: "실제 삭제 (false = dry run)"
        type: boolean
        required: false
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Sprint 28 BUG-S28-SEC-2 — SHA pin (다른 yml 3개 패턴 정합)
      - name: Setup uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
        with:
          version: "latest"

      # Sprint 28 BUG-S28-SEC-1 — `uv sync --frozen` 강제 (lock-pyproject drift 차단)
      - name: Sync deps
        run: uv sync --frozen

      - name: Run R2 cleanup
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          DELETE_FLAG=""
          if [ "${{ inputs.delete }}" = "true" ]; then
            DELETE_FLAG="--delete"
          fi
          uv run python -m scripts.r2_cleanup --days ${{ inputs.days }} $DELETE_FLAG
