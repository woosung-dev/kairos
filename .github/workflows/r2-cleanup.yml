# R2 인벤토리 — Kairos prefix(uploads/ · memory/) 의 객체 수·용량만 본다 (읽기 전용 · 체크리스트 0-12)
#
# ★이 워크플로는 더 이상 삭제하지 않는다 (2026-09-27).
#   예전 버전은 `delete=true` 로 uploads/ 아래 N 일 지난 객체를 DB 참조 확인 없이 전부 지웠다 —
#   살아 있는 회의 원본까지 (D-001 · D-002). 고아 판정에는 운영 DB 가 필요하고 러너는 DB 에 닿지 않는다.
#   미참조 객체 정리는 서버에서 한다 → docs/operations/r2-cleanup-cron.md §2
# ★키 목록을 출력하지 않는다. 공개 레포의 Actions 로그는 누구나 읽고, 키에 회의 파일명이 들어 있다.
#   스크립트의 --inventory 모드가 prefix 별 개수·용량·오래된 객체 수만 찍는다.
name: R2 Inventory (read-only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "이 N 일보다 오래된 객체 수를 따로 센다 (최소 7)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ADR-032 — 툴 버전 정본은 루트 `mise.toml` 의 `[tools]` 다 (uv 만 필요).
      - name: Setup toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.6
          install_args: uv

      # Sprint 28 BUG-S28-SEC-1 — `uv sync --frozen` 강제 (lock-pyproject drift 차단)
      - name: Sync deps
        run: uv sync --frozen

      # 입력값은 env 로 넘긴다 (run 블록에 ${{ }} 를 직접 넣지 않는다 — 스크립트 주입 방지).
      - name: Run R2 inventory (no delete, no keys printed)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DAYS: ${{ inputs.days }}
        run: uv run python -m scripts.r2_cleanup --inventory --days "$DAYS"
