# R2 nightly cleanup — uploads/ prefix 누적 객체 정리 (BL-043)
# 수동 트리거 전용 (workflow_dispatch). 사용자 검증 후 cron 추가.
name: R2 Cleanup

on:
  workflow_dispatch:
    inputs:
      days:
        description: "이 N 일보다 오래된 객체 정리"
        required: false
        default: "30"
      delete:
        description: "실제 삭제 (false = dry run)"
        type: boolean
        required: false
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ADR-032 — 툴 버전 정본은 루트 `mise.toml` 의 `[tools]` 다 (uv 만 필요).
      - name: Setup toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          version: 2026.8.6
          install_args: uv

      # Sprint 28 BUG-S28-SEC-1 — `uv sync --frozen` 강제 (lock-pyproject drift 차단)
      - name: Sync deps
        run: uv sync --frozen

      - name: Run R2 cleanup
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          DELETE_FLAG=""
          if [ "${{ inputs.delete }}" = "true" ]; then
            DELETE_FLAG="--delete"
          fi
          uv run python -m scripts.r2_cleanup --days ${{ inputs.days }} $DELETE_FLAG
