name: Deploy Backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  GCP_PROJECT: woosung-dev
  GCP_REGION: asia-northeast3
  SERVICE_NAME: kairos-api
  ARTIFACT_REGISTRY: kairos-docker
  BACKEND_IMAGE: kairos-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # WIF OIDC 토큰 발급용

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # ── GCP 인증 (WIF — 키 파일 없음) ────────────────────────────────────
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      # ── Docker → Artifact Registry 인증 ────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ── 이미지 빌드 + GAR push ─────────────────────────────────────────
      - name: Build and push image to GAR
        working-directory: backend
        run: |
          set -euo pipefail
          IMAGE_BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.BACKEND_IMAGE }}"
          SHA_TAG="$IMAGE_BASE:${{ github.sha }}"
          LATEST_TAG="$IMAGE_BASE:latest"

          docker buildx build \
            --platform linux/amd64 \
            --tag "$SHA_TAG" \
            --tag "$LATEST_TAG" \
            --push \
            .

          echo "IMAGE_URI=$SHA_TAG" >> "$GITHUB_ENV"

      # ── 기존 Secret Manager reference 제거 (env 타입 충돌 방지) ────────
      # deploy-cloudrun 액션이 env_vars + 기존 secrets 동시 적용 시 타입 충돌 발생.
      # truewords-platform 사고 사례 참조 — 별도 호출로 분리해야 안전.
      - name: Clear existing secret references
        continue-on-error: true
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --clear-secrets

      # ── Cloud Run 배포 ──────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522  # v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: --allow-unauthenticated --port=8000 --memory=1Gi --min-instances=0 --max-instances=3
          env_vars: |
            APP_ENV=production
            LOG_LEVEL=INFO
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      # ── Smoke test ─────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/v1/docs")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $URL/api/v1/docs → 200 (attempt $i)"
              exit 0
            fi
            echo "⏳ attempt $i: got $STATUS, retrying in 10s"
            sleep 10
          done
          echo "❌ Smoke test failed after 5 attempts"
          exit 1
