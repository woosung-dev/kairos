name: Deploy Backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  GCP_PROJECT: jetaime-dev
  GCP_REGION: asia-northeast3
  SERVICE_NAME: kairos-api
  ARTIFACT_REGISTRY: kairos-docker
  BACKEND_IMAGE: kairos-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # WIF OIDC 토큰 발급용

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # ── GCP 인증 (WIF — 키 파일 없음) ────────────────────────────────────
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      # ── Docker → Artifact Registry 인증 ────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ── 이미지 빌드 + GAR push ─────────────────────────────────────────
      - name: Build and push image to GAR
        working-directory: backend
        run: |
          set -euo pipefail
          IMAGE_BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.BACKEND_IMAGE }}"
          SHA_TAG="$IMAGE_BASE:${{ github.sha }}"
          LATEST_TAG="$IMAGE_BASE:latest"

          docker buildx build \
            --platform linux/amd64 \
            --tag "$SHA_TAG" \
            --tag "$LATEST_TAG" \
            --push \
            .

          echo "IMAGE_URI=$SHA_TAG" >> "$GITHUB_ENV"

      # ── 기존 Secret Manager reference 제거 (env 타입 충돌 방지) ────────
      # deploy-cloudrun 액션이 env_vars + 기존 secrets 동시 적용 시 타입 충돌 발생.
      # truewords-platform 사고 사례 참조 — 별도 호출로 분리해야 안전.
      - name: Clear existing secret references
        continue-on-error: true
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --clear-secrets

      # ── Cloud Run 배포 ──────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522  # v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          # --cpu-boost: cold start 시 CPU 2x 부스트 (asyncpg pool init + alembic 빠른 시작)
          # --no-cpu-throttling: 응답 외 시간에도 CPU 유지 — startup probe 통과 후 idle 안정
          # 비용 영향 0 — min-instances=0 유지 (scale to zero), instance 활성 시 부스트만.
          # BL-FIX(cold-start): 503 e2e 실패 회귀 방지 — deploy 직후 외 cold start 도 통과 보장
          #
          # Sprint 18 — startup probe HTTP GET /api/v1/ready (DB connection 확인 후 serve)
          # 총 startup budget: initial-delay 5s + period 10s × failure-threshold 30 = 305s.
          # ready 가 503 (DB degraded) 응답 시 트래픽 라우팅 안 함 → 사용자 503 회피.
          flags: >-
            --allow-unauthenticated --port=8000 --memory=1Gi
            --min-instances=0 --max-instances=3
            --cpu-boost --no-cpu-throttling
            --startup-probe=httpGet.path=/api/v1/ready,initialDelaySeconds=5,periodSeconds=10,timeoutSeconds=5,failureThreshold=30
          # CORS_ORIGINS: deploy-cloudrun@v2의 env_vars: 형식이 콤마를 변수 구분자로
          # 해석하므로 multi-URL(GH Secret의 "url1,url2")이 깨진다. prod는 vercel URL
          # 단일이면 충분하므로 FRONTEND_URL을 재사용해 단일 값 보장.
          env_vars: |
            APP_ENV=production
            LOG_LEVEL=INFO
            CORS_ORIGINS=${{ secrets.FRONTEND_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      # ── Smoke test ─────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/v1/docs")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $URL/api/v1/docs → 200 (attempt $i)"
              exit 0
            fi
            echo "⏳ attempt $i: got $STATUS, retrying in 10s"
            sleep 10
          done
          echo "❌ Smoke test failed after 5 attempts"
          exit 1
