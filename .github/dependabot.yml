# Dependabot 설정.
#
# ★`open-pull-requests-limit` 은 **생태계당** 상한이다. 아래 3 생태계 × 5 = 최대 15개가
#   동시에 열릴 수 있다. 2026-08-16 최초 실행 때 3×3=9개가 한 번에 열려서 실측으로 확인했다.
#   (설정을 처음 추가하면 interval 과 무관하게 즉시 1회 돈다.)
# 2026-08-16 레포 public 전환으로 Actions 가 복구돼 monthly 억제를 풀었다.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # 워크플로가 3rd-party action 을 전부 SHA pin 으로 쓴다 (ADR-027 D4).
  # 수기 갱신은 사실상 불가능하므로 dependabot 이 유일한 갱신 경로다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
