# Dependabot 설정.
#
# ★주기를 monthly + limit 3 으로 억제해 둔 이유:
#   GitHub Actions 가 결제 실패로 중단돼 있어(docs/TODO.md Blocked) 열린 PR 을 검증할 CI 가 없다.
#   weekly 로 두면 "머지 판단이 불가능한 PR" 만 쌓인다.
#   결제 복구 후 weekly 로 올린다 (docs/TODO.md "이번 라운드에서 생긴 후속").
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"

  # 워크플로가 3rd-party action 을 전부 SHA pin 으로 쓴다 (ADR-027 D4).
  # 수기 갱신은 사실상 불가능하므로 dependabot 이 유일한 갱신 경로다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
