[project]
name = "kairos-api"
version = "0.1.0"
description = "Kairos API - AI-powered meeting & knowledge management platform"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "google-genai>=1.70.0",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "openai>=2.30.0",
    "pydantic-settings>=2.13.1",
    "pyjwt[crypto]>=2.12.1",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.42.0",
    "pgvector>=0.4.2,<1.0.0",  # Sprint 16 ADR-020 — sqlalchemy.HALFVEC import 보장 (0.4.2+). 서버 확장은 0.8+ 별도 요구 (iterative_scan).
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 실제 PostgreSQL TestContainers를 사용하는 통합 테스트",
]
