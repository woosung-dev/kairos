[project]
name = "backend"
version = "0.1.0"
description = "Kairos API - AI-powered meeting & knowledge management platform"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=5.0.6",
    "fastapi>=0.135.3",
    "google-genai>=1.70.0",
    "greenlet>=3.3.2",
    "openai>=2.30.0",
    "pydantic-settings>=2.13.1",
    "pyjwt[crypto]>=2.12.1",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.42.0",
    "pgvector>=0.4.0",
    "sse-starlette>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
